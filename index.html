<!doctype html>
<html lang="es" data-theme="dark" data-palette="minimal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Temporizadores, Pomodoro y sesiones de concentración con skins temáticas." />
    <meta name="theme-color" content="#0b0c0f" />
    <title>A Nice Timer</title>
    <!-- El archivo ya existía en public/ y lo usa el icono de las notificaciones,
         pero sin este link el navegador nunca lo pedía para la pestaña. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica tema guardado antes del primer paint para evitar el flash de tema incorrecto.
      (function () {
        try {
          var raw = localStorage.getItem('ant:settings');
          if (!raw) return;
          var s = JSON.parse(raw).state;
          if (!s) return;
          var mode = s.themeMode;
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          if (resolved) document.documentElement.dataset.theme = resolved;
          if (s.palette) document.documentElement.dataset.palette = s.palette;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
